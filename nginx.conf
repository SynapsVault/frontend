server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Security headers (repeated in locations below: nginx drops server-level
  # add_header directives in any location that defines its own)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Container health check (see Dockerfile HEALTHCHECK)
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Cache fingerprinted static assets forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Never cache the service worker or the HTML shell, so deploys roll out
  location ~* ^/(sw\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
