<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e16" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary Meta Tags -->
    <title>SynapsVault — Payment-Protected Vault for Digital Resources on Stellar</title>
    <meta name="title" content="SynapsVault — Payment-Protected Vault for Digital Resources on Stellar" />
    <meta name="description" content="Store, protect, and monetize your digital resources with HTTP 402 payments on Stellar. Creators receive USDC directly to their wallet. No accounts, no middleman." />
    <meta name="keywords" content="Stellar, USDC, digital marketplace, AI agents, micropayments, x402, Soroban, blockchain payments, content monetization" />
    <meta name="author" content="SynapsVault" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SynapsVault" />
    <meta property="og:title" content="SynapsVault — Payment-Protected Vault for Digital Resources on Stellar" />
    <meta property="og:description" content="Store, protect, and monetize your digital resources with HTTP 402 payments on Stellar. Creators receive USDC directly to their wallet. No accounts, no middleman." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SynapsVault — Payment-Protected Vault for Digital Resources on Stellar" />
    <meta name="twitter:description" content="Store, protect, and monetize your digital resources with HTTP 402 payments on Stellar. Creators receive USDC directly to their wallet. No accounts, no middleman." />

    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Fonts: Inter (UI), Sora (display), JetBrains Mono (addresses, prices) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700&display=swap"
    />

    <!-- Apply the saved/system theme before first paint to avoid a light flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("synapsvault-theme");
          var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
